[project]
name = "comfyui-bat-nodepack"
description = "Video, animation, masking and compositing nodes for ComfyUI, with on-node editors (Roto, Animated Crop/Grade, Advanced Blend, Layered Images), a unified EXR/sequence/movie Loader, Video Combine, SeC segmentation and an execution profiler."
version = "1.0.0"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
# Nothing beyond what ComfyUI itself installs (torch, numpy, pillow, opencv,
# imageio-ffmpeg). The heavy SeC stack and OpenImageIO are optional extras so
# a Manager/registry install does not pull ~2 GB of transformers into every
# environment — see requirements.txt and the README's "Optional features".
dependencies = []

[project.optional-dependencies]
exr = ["OpenImageIO"]
sec = [
    "transformers>=4.40.0",
    "safetensors>=0.4.0",
    "timm>=0.9.0",
    "peft>=0.10.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.1.0",
    "einops>=0.7.0",
    "iopath",
    "accelerate>=0.26.0",
    "huggingface_hub>=0.23.0",
    "scipy>=1.7.0",
    "scikit-image>=0.19.0",
]

[project.urls]
Repository = "https://github.com/BeeeFX/ComfyUI-BAT-NodePack"
"Bug Tracker" = "https://github.com/BeeeFX/ComfyUI-BAT-NodePack/issues"

[tool.comfy]
# Set to your Comfy Registry publisher id (registry.comfy.org) before running
# `comfy node publish`; the registry rejects an empty one.
PublisherId = ""
DisplayName = "BAT NodePack"
Icon = ""
includes = []
